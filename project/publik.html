<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD8 | Teknisi Rumahan - Koleksi Proyek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../project/publik.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="../index.html" class="logo">MD<span>8</span> | Teknisi Rumahan</a>
        </header>

        <div class="page-title">
            <h1>📂 Koleksi Proyek</h1>
            <p>Berbagai proyek elektronika dan teknologi rumahan</p>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Memuat proyek...</p>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL -->
    <div class="modal-overlay" id="modalDetail">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            
            <h2 class="modal-title" id="modalTitle"></h2>
            <div>
                <span class="modal-badge" id="modalBadge">PROJECT</span>
                <span class="modal-views"><i class="fas fa-eye"></i> <span id="modalViews">0</span> views</span>
            </div>

            <div class="modal-gallery" id="modalGallery"></div>

            <div class="modal-description">
                <h3>📋 Deskripsi & Komponen</h3>
                <div class="desc-content" id="modalDescription"></div>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImage" src="" alt="Preview">
    </div>

    <script>
        // ============ DATA ============
        let projects = [];
        let currentProjectId = null;

        function loadProjects() {
            const stored = localStorage.getItem('md8_projects_data');
            
            if (stored) {
                try {
                    projects = JSON.parse(stored);
                } catch (e) {
                    projects = [];
                }
            } else {
                // Data default
                projects = [
                    {
                        id: Date.now() + 1,
                        title: 'Speaker BT Portable',
                        category: 'PROJECT',
                        description: '<p><strong>Komponen:</strong></p><ul><li>Baterai 18650 (2x)</li><li>BMS 2S</li><li>Modul Bluetooth MH-M18</li><li>Speaker 3W</li></ul><p><strong>Cara Membuat:</strong></p><p>Rangkai semua komponen sesuai skema, pastikan koneksi ground dan power benar.</p>',
                        images: ['../p2.png'],
                        views: 0
                    },
                    {
                        id: Date.now() + 2,
                        title: 'Power Bank DIY',
                        category: 'PROJECT',
                        description: '<p>Power bank kapasitas besar dengan fast charging menggunakan modul TP4056 dan boost converter.</p>',
                        images: ['../p2.png'],
                        views: 0
                    },
                    {
                        id: Date.now() + 3,
                        title: 'Lampu Taman Solar',
                        category: 'PLTS',
                        description: '<p>Lampu otomatis dengan sensor LDR dan panel surya 5V. Baterai 18650 untuk penyimpanan daya.</p>',
                        images: ['../p2.png'],
                        views: 0
                    }
                ];
                saveProjects();
            }
            renderProjects();
        }

        function saveProjects() {
            localStorage.setItem('md8_projects_data', JSON.stringify(projects));
        }

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');

            if (!projects || projects.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>Belum Ada Proyek</h3>
                        <p>Proyek akan muncul setelah admin menambahkan.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = projects.map(project => `
                <div class="project-card" onclick="openModal('${project.id}')">
                    <img src="${project.images && project.images.length > 0 ? project.images[0] : '../p2.png'}" 
                         alt="${project.title}" 
                         class="card-image"
                         onerror="this.src='../p2.png'">
                    <div class="card-body">
                        <span class="badge">${project.category || 'PROJECT'}</span>
                        <h3>${project.title}</h3>
                        <div class="excerpt">${stripHtml(project.description)}</div>
                        <div class="meta">
                            <i class="fas fa-images"></i> ${project.images ? project.images.length : 0} gambar
                            <span style="margin-left:15px;"><i class="fas fa-eye"></i> ${project.views || 0} views</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // ============ MODAL ============
        function openModal(id) {
            const project = projects.find(p => p.id == id);
            if (!project) return;

            currentProjectId = id;

            // Update views
            project.views = (project.views || 0) + 1;
            saveProjects();
            renderProjects();

            // Set data ke modal
            document.getElementById('modalTitle').textContent = project.title;
            document.getElementById('modalBadge').textContent = project.category || 'PROJECT';
            document.getElementById('modalViews').textContent = project.views || 0;

            // Gallery
            const gallery = document.getElementById('modalGallery');
            if (project.images && project.images.length > 0) {
                gallery.innerHTML = project.images.map(img => `
                    <img src="${img}" alt="Gambar" onerror="this.src='p2.png'" onclick="openLightbox('${img}')">
                `).join('');
            } else {
                gallery.innerHTML = `<img src="p2.png" alt="No image" onclick="openLightbox('p2.png')">`;
            }

            // Description
            document.getElementById('modalDescription').innerHTML = project.description || '<p>Deskripsi tidak tersedia.</p>';

            // Tampilkan modal
            document.getElementById('modalDetail').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalDetail').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============ LIGHTBOX ============
        function openLightbox(src) {
            document.getElementById('lightboxImage').src = src;
            document.getElementById('lightboxOverlay').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightboxOverlay').classList.remove('active');
        }

        // ============ EVENT ============
        // Tutup modal saat klik di luar
        document.getElementById('modalDetail').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Tutup lightbox saat klik di luar
        document.getElementById('lightboxOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('lightboxOverlay').classList.contains('active')) {
                    closeLightbox();
                } else if (document.getElementById('modalDetail').classList.contains('active')) {
                    closeModal();
                }
            }
        });

        // ============ INIT ============
        loadProjects();

        // Listen untuk perubahan data
        window.addEventListener('storage', function(e) {
            if (e.key === 'md8_projects_data') {
                loadProjects();
            }
        });
    </script>
</body>
</html>
