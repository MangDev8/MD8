<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD8 | Teknisi Rumahan - Koleksi Proyek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="publik.css">
</head>
<body>
    <div class="container">
        <!-- Header (tanpa tombol admin) -->
        <header class="header">
            <a href="index.html" class="logo">MD<span>8</span> | Teknisi Rumahan</a>
            <!-- Tombol admin dihapus -->
        </header>

        <!-- Judul Halaman -->
        <div class="page-title">
            <h1>📂 Koleksi Proyek</h1>
            <p>Berbagai proyek elektronika, IoT, dan teknologi rumahan</p>
        </div>

        <!-- Grid Proyek -->
        <div class="projects-grid" id="projectsGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Memuat proyek...</p>
            </div>
        </div>
    </div>

    <!-- Modal Detail Proyek -->
    <div class="modal-overlay" id="modalDetail">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            
            <img class="modal-header-image" id="modalHeaderImage" src="" alt="Header Proyek">
            
            <div class="modal-body">
                <div>
                    <span class="badge badge-project" id="modalBadge">PROJECT</span>
                </div>
                
                <h2 class="modal-title" id="modalTitle"></h2>
                
                <div class="modal-meta">
                    <span><i class="fas fa-eye"></i> <span id="modalViews">0</span> views</span>
                    <span><i class="fas fa-images"></i> <span id="modalImageCount">0</span> gambar</span>
                </div>

                <div class="modal-gallery" id="modalGallery"></div>

                <div class="modal-description">
                    <h3>📋 Deskripsi & Panduan</h3>
                    <div class="desc-content" id="modalDescription"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImage" src="" alt="Preview Gambar">
    </div>

    <script src="publik.js"></script>
</body>
</html>
